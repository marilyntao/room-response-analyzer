# Interface self-check: cable from an output to an input (or the interface's internal loopback).
# Run this first. If it fails, the problem is the interface/driver, not the room.
[sweep]
f1 = 20
f2 = 20000
duration_s = 6
fs = 48000
level_dbfs = -12
pre_s = 0.5
tail_s = 1.0
noise_s = 3.0

[device]          # run `python -m sweepqa list-devices`; channels are 1-based
input = 0        # empty = system default
output = 0
out_ch = 1
in_ch = 5

[limits.frequency_response]
mode = "absolute"   # loopback has a known gain, so judge absolute gain
target_db = 0.0
[[limits.frequency_response.bands]]
f_lo = 30
f_hi = 18000
tol_db = 0.5

[[limits.thd.bands]]
f_lo = 50
f_hi = 8000
max_percent = 0.05

[limits.snr]
min_db = 80

[limits.sanity]
max_peak_dbfs = -3
max_delay_ms = 50
